<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Pranav Harnaiya - Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#1e1240"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- drifting glow orbs -->
    <circle r="190" fill="url(#glowA)">
      <animate attributeName="cx" values="150;300;150" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;190;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="210" fill="url(#glowB)">
      <animate attributeName="cx" values="860;700;860" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;80;220" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- floating code symbols -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#ffffff" fill-opacity="0.14">
      <text x="70" y="230">&lt;/&gt;</text>
      <text x="880" y="70">{ }</text>
      <text x="790" y="245">=&gt;</text>
      <text x="120" y="60">[ ]</text>
      <text x="930" y="170">;</text>
      <text x="480" y="40">#</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="6s" repeatCount="indefinite"/>
    </g>

    <!-- title -->
    <text x="500" y="125" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#txt)" letter-spacing="1">
      Pranav Harnaiya
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="178" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#c7d2fe">
      Full-Stack Developer  ·  AI-Powered Web Apps  ·  Problem Solver
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
    </text>

    <!-- animated underline -->
    <rect x="350" y="205" height="4" rx="2" fill="url(#txt)">
      <animate attributeName="width" values="0;300" dur="1.6s" begin="0.6s" fill="freeze"/>
    </rect>
    <circle cy="207" r="6" fill="#22d3ee">
      <animate attributeName="cx" values="350;650;350" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="20" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>
</svg>
